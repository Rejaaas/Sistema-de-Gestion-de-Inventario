<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="styles-actions.css">
    <script defer src="../script.js"></script>
</head>

<body>
    <div class="login-container">
        <h2>Eliminar producto</h2>
        <p class="menu-label">Introduce el ID o el Nombre del producto</p>

        <form id="deleteProductForm">
            <input type="number" id="deleteId" placeholder="ID del producto (ej. 1)">

            <p class="or-divider">- O TAMBIÉN -</p>

            <input type="text" id="deleteNombre" placeholder="Nombre (ej. Bullpadel)">

            <button type="submit" class="btn-danger">Eliminar producto</button>
        </form>

        <div id="mensajeDelete"></div>
        <br>
        <button type="button" onclick="window.location.href='../panel.html'">Volver al Panel</button>
    </div>
</body>

</html>
