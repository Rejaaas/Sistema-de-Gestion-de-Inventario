<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Padel Rejas</title>
    <link rel="stylesheet" href="css/login-register-panel.css">
    <script defer src="script.js"></script>
</head>

<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="mensaje"></div>
        <br>
        <button type="button" onclick="window.location.href='create-user.html'" style="background-color: #333;">Crear
            cuenta nueva</button>
    </div>
</body>

</html>
